{% extends 'dashboard/components/base.html' %}
{% load translate %}
{% load static %}
{% block title %}Reset Password{% endblock %}
{% block auth %}
<div class="account-content">
    <div class="login-wrapper login-new">
        <div class="row w-100">
            <div class="mx-auto col-lg-5">
                <div class="login-content user-login">
                    <div class="login-logo">
                        <img src="{% static 'dashboard/images/logo.png' %}" alt="{{site.name}}">
                    </div>
                    <form action="{{ reset_password_url }}" method="POST">
                        {% csrf_token %}
                        <div class="card">
                            <div class="p-5 card-body">
                                <div class="af-icon"><i class="ti ti-key"></i></div>
                                <div class="login-userheading text-center">
                                    <h3>Reset Password</h3>
                                    <h4>Enter your new password</h4>
                                </div>

                                <div class="af-steps">
                                    <div class="af-step done"><span><i
                                                class="ti ti-check"></i></span><small>Email</small>
                                    </div>
                                    <div class="af-line"></div>
                                    <div class="af-step done"><span><i class="ti ti-check"></i></span><small>OTP</small>
                                    </div>
                                    <div class="af-line"></div>
                                    <div class="af-step active"><span>3</span><small>Reset</small></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <div class="pass-group">
                                        <input type="password" name="password" required minlength="8"
                                            class="pass-input form-control" placeholder="At least 8 characters">
                                        <span class="ti toggle-password ti-eye-off text-gray-9"></span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <div class="pass-group">
                                        <input type="password" name="confirm_password" required minlength="8"
                                            class="pass-input form-control" placeholder="Re-enter your password">
                                        <span class="ti toggle-password ti-eye-off text-gray-9"></span>
                                    </div>
                                </div>

                                <div class="form-login mb-3">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="ti ti-device-floppy me-1"></i> Update Password
                                    </button>
                                </div>

                                <div class="text-center">
                                    <a href="{{ dashboard_login_url }}" class="text-primary">
                                        <i class="ti ti-arrow-left me-1"></i> Back to Sign in
                                    </a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
                    <p>Coded by <span class="text-danger">Page Myanmar</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
