{% extends 'website/components/base.html' %}
{% block title %} Register {% endblock %}
{% block body %}
{% load static %}
{% load humanize %}
{% load myanmar_number %}

<!-- Import Kawaii/Anime Style Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

<style>
    /* Anime Aesthetic Theme Variables */
    :root {
        --anime-purple: #b388ff;
        --anime-pink: #ff85a2;
        --anime-light-blue: #e0f7fa;
        --anime-sparkle: #70d6ff;
        --form-text: #4a4e69;
    }

    /* Background Wrapper with Soft sparkles feel */
    .auth-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        font-family: 'Nunito', sans-serif;
    }

    /* Main Container with Cat Ears */
    .auth-card {
        background: white;
        border-radius: 32px;
        box-shadow: 0 20px 50px rgba(179, 136, 255, 0.2);
        max-width: 950px;
        width: 100%;
        position: relative;
        border: 4px solid #f3e5f5;
    }

    .auth-card::before {
        left: 40px;
        transform: rotate(-15deg);
    }
    .auth-card::after {
        left: 95px;
        transform: rotate(15deg);
        border-radius: 70% 40% 0% 0%;
    }

    /* Split Container Setup */
    .auth-split-container {
        display: flex;
        flex-direction: row;
        overflow: hidden;
        border-radius: 28px;
        min-height: 500px;
    }

    /* Left Side Banner (Anime Art Room) */
    .auth-sidebar-banner {
        flex: 1;
        background: linear-gradient(135deg, #c5a3ff 0%, #ff9ebb 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        color: white;
        text-align: center;
        position: relative;
    }

    .anime-artwork-placeholder {
        max-width: 280px;
        width: 100%;
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        margin-bottom: 20px;
        animation: floatArt 4s ease-in-out infinite;
    }

    @keyframes floatArt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    .brand-title {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 2.5rem;
        text-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        background: white;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background: linear-gradient(to right, #ffffff, #fff3f8);
        -webkit-background-clip: text;
    }

    /* Right Side Form (Manga Speed Lines Grid) */
    .auth-form-container {
        flex: 1.2;
        padding: 50px;
        background-color: #ffffff;
        position: relative;
        /* Subtle Manga Speed Line Pattern Simulation */
        background-image: radial-gradient(circle at center, transparent 25%, #ffffff 25%), 
                          linear-gradient(0deg, transparent 49%, #f8f9fa 49%, #f8f9fa 51%, transparent 51%), 
                          linear-gradient(90deg, transparent 49%, #f8f9fa 49%, #f8f9fa 51%, transparent 51%);
        background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    .form-heading {
        font-family: 'Fredoka', sans-serif;
        color: var(--anime-pink);
        font-weight: 700;
        font-size: 2.2rem;
        margin-bottom: 30px;
    }

    /* Kawaii Form Elements */
    .form-label {
        font-weight: 800;
        color: var(--form-text);
        font-size: 0.95rem;
        margin-left: 12px;
    }

    .input-group-anime {
        position: relative;
        margin-bottom: 24px;
    }

    .input-group-anime .form-control {
        border: 2.5px solid #ebd9fc;
        border-radius: 50px;
        padding: 12px 25px;
        font-size: 1rem;
        color: var(--form-text);
        font-weight: 600;
        transition: all 0.3s ease;
        background-color: #fff;
    }

    .input-group-anime .form-control:focus {
        border-color: var(--anime-pink);
        box-shadow: 0 0 15px rgba(255, 133, 162, 0.25);
        outline: none;
    }

    /* Sparkle/Eye Icons inside Input boxes */
    .input-addon-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--anime-purple);
        opacity: 0.7;
        z-index: 5;
    }

    /* Action Buttons */
    .btn-anime-submit {
        background: linear-gradient(45deg, var(--anime-pink), #ffccd5);
        border: none;
        color: white;
        font-weight: 800;
        font-family: 'Fredoka', sans-serif;
        font-size: 1.2rem;
        padding: 12px;
        border-radius: 50px;
        box-shadow: 0 6px 20px rgba(255, 133, 162, 0.3);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-anime-submit:hover {
        background: linear-gradient(45deg, #ff6b8b, var(--anime-pink));
        transform: scale(1.03);
        box-shadow: 0 8px 25px rgba(255, 133, 162, 0.45);
        color: white;
    }

    /* Switch Link decoration */
    .register-redirect-text {
        font-weight: 700;
        color: #7a7d93;
    }

    .register-redirect-text a {
        color: var(--anime-pink);
        text-decoration: none;
        border-bottom: 2px dashed var(--anime-pink);
        transition: all 0.2s;
    }

    .register-redirect-text a:hover {
        color: #ff4d73;
        border-bottom-style: solid;
    }

    /* Responsive Mobile Design overrides */
    @media (max-width: 768px) {
        .auth-split-container {
            flex-direction: column;
        }
        .auth-sidebar-banner {
            padding: 30px 20px;
        }
        .auth-form-container {
            padding: 35px 20px;
        }
        
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card" id="authCard">
        <div class="auth-split-container">
            
            <!-- LEFT PANEL: Banner Graphics -->
            <div class="auth-sidebar-banner">
                <!-- Replace src below with your custom mascot/illustration path if needed -->
                <!-- <img src="https://illustrations.popsy.co/pastel/reading-a-book.svg" class="anime-artwork-placeholder" alt="Novel Hub Mascot"> -->
                <h2 class="brand-title">IQ Novel</h2>
                <p class="small opacity-90 mt-2">Unlock worlds of boundless imagination!</p>
            </div>

            <!-- RIGHT PANEL: Login Process form Layout -->
            <div class="auth-form-container">
                <h4 class="form-heading text-center">Register</h4>

                <form method="POST" action="{{website_register_url}}">
                    {% csrf_token %}
                    <!-- Username Field Wrapper -->
                    <div class="mb-4">
                        <label class="form-label">Username</label>
                        <div class="input-group-anime">
                            <input type="text" class="form-control" name="username" placeholder="Enter your username" required>
                            <i class="fa-solid fa-sparkles input-addon-icon"></i>
                        </div>
                    </div>
                    
                    <!-- Email Field Wrapper -->
                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <div class="input-group-anime">
                            <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                            <i class="fa-solid fa-sparkles input-addon-icon"></i>
                        </div>
                    </div>

                    <!-- Password Field Wrapper -->
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group-anime">
                            <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
                            <i class="fa-regular fa-eye-slash input-addon-icon"></i>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Comfirm password</label>
                        <div class="input-group-anime">
                            <input type="password" class="form-control" name="comfirm_password" placeholder="Enter your password" required>
                            <i class="fa-regular fa-eye-slash input-addon-icon"></i>
                        </div>
                    </div>

                    <!-- CTA Submit Button -->
                    <button type="submit" class="btn btn-anime-submit w-100 mt-2">Register</button>
                </form>

                <!-- Footer Redirection Link alternative toggle -->
                <p class="text-center mt-4 mb-0 register-redirect-text">
                    Don’t have an account? 
                    <a href="{% url 'website_login' %}">Login here</a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock %}
